[project]
name = "welfare-helper-demo"
version = "0.1.0"
description = "OpenAI Agents SDK live demo for matching welfare requests with helpers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "openai-agents>=0.2.0",
  "pydantic>=2.11.0",
  "python-dotenv>=1.1.0",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

